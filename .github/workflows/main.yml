name: 'Scheduled Auto Update'

on:
  schedule:
    - cron: '0 22 */2 * *'
    - cron: '0 10 */2 * *'
  workflow_dispatch:
    branches: [master, dev, gd]
    inputs:
      custom_message:
        description: 'Custom commit message'
        required: false
        default: 'Auto Updated by GitHub Actions'

defaults:
  run:
    shell: bash -eo pipefail
    working-directory: ${{ github.workspace }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.sha }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_CACHE_DIR: '0'
  PYTHONUNBUFFERED: '1'
  DEBIAN_FRONTEND: 'noninteractive'

jobs:
  update:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: none
    if: github.repository_owner != ''
    steps:
      - name: Resolve target branch
        id: branch
        run: |
          OWNER="${{ github.repository_owner }}"
          TRIGGER_BRANCH="${{ github.ref_name }}"
          TARGET_BRANCH=$([[ $TRIGGER_BRANCH =~ ^(master|dev|gd)$ ]] && echo $TRIGGER_BRANCH || [[ $OWNER == "Guovin" ]] && echo "gd" || echo "master")
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_ENV
          echo "target_branch=$TARGET_BRANCH" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
          lfs: false
          persist-credentials: true
          clean: true
        timeout-minutes: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pipenv'
          cache-dependency-path: |
            Pipfile.lock
            Pipfile
        timeout-minutes: 3

      - name: Check open_driver config
        id: driver
        run: |
          OPEN_DRIVER=$(python -c '
          import sys,os;sys.path.insert(0,os.getcwd())
          try:from utils.config import config;od=str(config.open_driver).lower()
          except:od="false"
          print(od)')
          echo "open_driver=$OPEN_DRIVER" >> $GITHUB_OUTPUT

      - name: Install system deps
        run: |
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            $([[ ${{ steps.driver.outputs.open_driver }} == "true" ]] && echo "chromium chromium-driver") \
            > /dev/null
          sudo apt-get clean > /dev/null
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install Pipenv & deps
        run: |
          python -m pip install --upgrade pip -q
          pip install --user pipenv -q
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          [[ -f Pipfile ]] || pipenv --python $(which python${{ env.PYTHON_VERSION }}) -q
          pipenv install --deploy --ignore-pipfile -q
          [[ ${{ steps.driver.outputs.open_driver }} == "true" ]] && pipenv install selenium -q

      - name: Run update script
        run: |
          ulimit -v 2097152
          pipenv run dev
        timeout-minutes: 8
        env:
          CHROMEDRIVER_PATH: ${{ steps.driver.outputs.open_driver == 'true' && '/usr/bin/chromedriver' || '' }}
          CHROME_BIN: ${{ steps.driver.outputs.open_driver == 'true' && '/usr/bin/chromium' || '' }}

      - name: Commit & push
        id: push
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          if ! git diff-index --quiet HEAD --; then
            MSG="${{ github.event.inputs.custom_message }} | Run #${{ github.run_id }} | $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git commit -m "$MSG"
            for i in {1..3}; do
              git push origin ${{ env.TARGET_BRANCH }} --atomic && break
              sleep $((i*2))
            done
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 2

      - name: Post-run cleanup
        if: always()
        run: |
          pipenv --rm > /dev/null 2>&1 || true
          git reset --hard HEAD > /dev/null 2>&1 || true

      - name: Notify failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Auto Update Failed\nRepo: ${{ github.repository }}\nBranch: ${{ env.TARGET_BRANCH }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
