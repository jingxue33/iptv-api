name: 'Scheduled Auto Update'

# 触发规则：定时任务 + 手动触发（支持指定分支）
on:
  schedule:
    # UTC时间 → 北京时间=UTC+8：每隔2天 06:00/18:00执行
    - cron: '0 22 */2 * *'
    - cron: '0 10 */2 * *'
  workflow_dispatch:
    branches: [master, dev, gd]
    inputs:
      # 手动触发时可自定义备注
      custom_message:
        description: 'Custom commit message'
        required: false
        default: 'Github Action Auto Updated'

# 全局配置：减少重复、统一行为
defaults:
  run:
    shell: bash
    working-directory: .  # 统一工作目录

# 并发控制：避免同一分支同时运行多个实例
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # 超时保护（避免资源浪费）
    permissions:
      # 最小权限原则：仅授予必要权限
      contents: write
      pull-requests: read
    steps:
      ###########################################################################
      # 1. 环境准备：分支判断 + 路径配置
      ###########################################################################
      - name: Determine target branch
        id: branch
        run: |
          # 健壮的分支逻辑：优先使用触发分支，否则按仓库所有者判断
          TRIGGER_BRANCH=${{ github.ref_name }}
          OWNER=${{ github.repository_owner }}
          
          if [[ $TRIGGER_BRANCH =~ ^(master|dev|gd)$ ]]; then
            TARGET_BRANCH=$TRIGGER_BRANCH
          elif [[ $OWNER == "Guovin" ]]; then
            TARGET_BRANCH="gd"
          else
            TARGET_BRANCH="master"
          fi
          
          echo "target_branch=$TARGET_BRANCH" >> $GITHUB_OUTPUT
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_ENV
          echo "✅ Target branch set to: $TARGET_BRANCH"

      ###########################################################################
      # 2. 代码拉取：最新版 + 高效拉取
      ###########################################################################
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1  # 仅拉取最新提交（提速）
          lfs: false  # 禁用LFS（无需求时）
          persist-credentials: true  # 保留凭证用于推送

      ###########################################################################
      # 3. Python环境：最新版 + 缓存优化
      ###########################################################################
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pipenv'  # 自动缓存pipenv依赖
          cache-dependency-path: |  # 指定缓存依赖文件
            Pipfile.lock
            Pipfile

      ###########################################################################
      # 4. 配置检查：健壮的open_driver判断
      ###########################################################################
      - name: Check open_driver configuration
        id: driver_check
        run: |
          # 增强版配置检查：处理路径、异常、布尔值标准化
          OPEN_DRIVER=$(python - << 'EOF'
          import sys
          import os
          sys.path.insert(0, os.getcwd())
          try:
              from utils.config import config
              # 统一输出为小写布尔字符串
              open_driver = str(getattr(config, 'open_driver', False)).lower()
          except Exception as e:
              print(f"⚠️ Config check warning: {e}", file=sys.stderr)
              open_driver = "false"
          print(open_driver)
          EOF
          )
          echo "open_driver=$OPEN_DRIVER" >> $GITHUB_OUTPUT
          echo "OPEN_DRIVER=$OPEN_DRIVER" >> $GITHUB_ENV
          echo "🔍 Open driver config: $OPEN_DRIVER"

      ###########################################################################
      # 5. 浏览器环境：按需安装（仅当open_driver=true时）
      ###########################################################################
      - name: Install Chrome + ChromeDriver
        if: steps.driver_check.outputs.open_driver == 'true'
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true  # 自动安装匹配的driver
          chromedriver-cache: true    # 缓存driver（提速）

      ###########################################################################
      # 6. 系统依赖：精简安装 + 缓存
      ###########################################################################
      - name: Install system dependencies
        run: |
          # 加速apt更新 + 精简安装 + 清理缓存
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libglib2.0-0 \
            libnss3 \
            libgconf-2-4 \
            libfontconfig1
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "✅ System dependencies installed"

      ###########################################################################
      # 7. Python依赖：Pipenv优化 + 条件安装
      ###########################################################################
      - name: Install Pipenv & project dependencies
        run: |
          # 升级pip + 安装pipenv
          python -m pip install --upgrade pip --quiet
          pip install --user pipenv --quiet
          echo "$HOME/.local/bin" >> $GITHUB_PATH  # 确保pipenv在PATH中
          
          # 初始化Pipenv（指定Python版本）
          pipenv --python $(which python3.13) --quiet
          
          # 安装核心依赖（严格使用lock文件）
          pipenv install --deploy --ignore-pipfile --quiet
          
          # 按需安装selenium
          if [[ "${{ steps.driver_check.outputs.open_driver }}" == "true" ]]; then
            pipenv install selenium --quiet
            echo "✅ Selenium installed (open_driver=true)"
          fi
          echo "✅ All dependencies installed"

      ###########################################################################
      # 8. 核心逻辑：运行更新脚本
      ###########################################################################
      - name: Run update script
        run: |
          # 开启Python无缓冲输出（实时日志）
          export PYTHONUNBUFFERED=1
          # 执行更新脚本
          pipenv run dev
        env:
          # 传递必要的环境变量
          CHROME_PATH: ${{ steps.driver_check.outputs.open_driver == 'true' && '/usr/bin/google-chrome' || '' }}
          DRIVER_PATH: ${{ steps.driver_check.outputs.open_driver == 'true' && '/usr/local/bin/chromedriver' || '' }}

      ###########################################################################
      # 9. 提交推送：安全推送 + 变更检查
      ###########################################################################
      - name: Commit and push changes
        id: commit
        run: |
          # 配置Git身份
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 检查变更
          git add .
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # 构造提交信息（支持手动自定义）
          COMMIT_MSG="${{ github.event.inputs.custom_message }}: $(date +'%Y-%m-%d %H:%M:%S %Z')"
          
          # 提交并推送（非强制，安全优先）
          git commit -m "$COMMIT_MSG"
          git push origin ${{ env.TARGET_BRANCH }} --porcelain
          
          echo "✅ Changes pushed to $TARGET_BRANCH"
          echo "has_changes=true" >> $GITHUB_OUTPUT
        env:
          # 使用内置Token（自动授权，无需手动配置）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      ###########################################################################
      # 10. 通知：可选（如需失败通知，取消注释并配置）
      ###########################################################################
