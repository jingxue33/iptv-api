[Settings]
# ===================== 核心路径（权限适配+无语法错误）=====================
source_file = config/unicom_north_demo.txt
final_file = output/unicom_north_result.txt
# 注：Linux/Docker需提前创建目录并赋权，避免文件找不到报错

# ===================== 基础功能（保留核心，规避逻辑冲突）=====================
open_driver = False
open_epg = True
open_empty_category = False
open_filter_resolution = True
open_filter_speed = True
open_speed_test = True
open_update = True
open_update_time = True
open_service = True

# ===================== 源功能（关闭FOFA规避权限报错，聚焦联通核心源）=====================
open_hotel = False
open_hotel_foodie = False
open_hotel_fofa = False
open_local = True
open_multicast = True
open_multicast_foodie = True
open_multicast_fofa = False  # 关闭FOFA，避免未配置API导致的报错
open_online_search = True
open_subscribe = True

# ===================== 高级功能（关闭冗余，适配联通网络特性）=====================
open_m3u_result = True
open_rtmp = False  # 北部联通极少RTMP源，关闭减少无效请求
open_request = False
open_supply = True
open_use_cache = True
open_history = True
open_headers = True
open_url_info = True

# ===================== 网络配置（Docker适配+联通CDN优化）=====================
app_host = http://0.0.0.0
app_port = 8000  # 避开运营商管控端口
cdn_url = https://cdn.unicom.cn/iptv-north  # 联通北方专属CDN，提升加载速度

# ===================== 数量控制（适配联通源规模，无上限溢出）=====================
hotel_num = 0
local_num = 30
multicast_num = 25
subscribe_num = 20
online_search_num = 15
urls_limit = 80  # 总上限适配各模块总和，避免URL截断

# ===================== 分页配置（适配大数量，避免单页过载）=====================
hotel_page_num = 0
multicast_page_num = 3
online_search_page_num = 3

# ===================== 地区配置（修正空值语法，锁定北部省份）=====================
hotel_region_list =  # 空值正确写法，避免""导致的解析报错
multicast_region_list = 北京,天津,河北,山西,内蒙古,辽宁,吉林,黑龙江
location = 北京,天津,河北,山西,内蒙古,辽宁,吉林,黑龙江

# ===================== 网络类型（强制IPv4，适配北部联通网络现状）=====================
ipv_type = ipv4
ipv_type_prefer = ipv4
ipv4_num = 25
ipv6_num = 0
ipv6_support = False  # 关闭IPv6，避免双栈冲突报错

# ===================== 过滤条件（精准筛选联通源，无无效字段）=====================
isp = 联通
min_resolution = 1280x720
max_resolution = 1920x1080
min_speed = 1.2

# ===================== 性能优化（适配联通低延迟特性，减少超时报错）=====================
recent_days = 7
request_timeout = 18
speed_test_limit = 10
speed_test_timeout = 12
speed_test_filter_host = True
request_retry_times = 1

# ===================== 来源偏好（优先低延迟源，提升加载效率）=====================
origin_type_prefer = local,subscribe,multicast

# ===================== 时间配置（无歧义，避免日志写入报错）=====================
time_zone = Asia/Shanghai
update_interval = 4h
update_time_position = top:/data/unicom_north/iptv_update_log.txt;backup:https://your-private-unicom-repo/iptv-north-update-log.txt
