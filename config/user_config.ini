[Settings]  # 配置节：所有设置项的起始标识
# 基础文件配置（TXT输出+高分辨率）  # 注释：该部分说明输出与模板相关设置
source_file = config/user_demo.txt  # 模板文件路径：用于生成频道结果的模板文件
final_file = output/IPTV_4K_Fast_All_Network.txt  # 最终输出文件：生成的高分辨率 TXT 文件路径

# 核心开关（高分辨率+全网通+秒播）  # 注释：控制各功能模块的开关
open_driver = False  # 是否启用浏览器驱动（Selenium 等），False 可减少内存消耗
open_epg = False  # 是否启用 EPG（电子节目单），False 可减少额外请求与解析
open_empty_category = True  # 隐藏无效分类，减少列表显示长度与加载延时
open_filter_resolution = True  # 是否开启分辨率过滤，仅保留满足 min_resolution 的接口
open_filter_speed = True  # 是否开启速率过滤，仅保留满足 min_speed 的接口
open_hotel = True  # 是否启用酒店源，用于补充本地/订阅源
open_hotel_foodie = True  # 酒店源相关子开关（Foodie 模式）
open_hotel_fofa = True  # 酒店源相关子开关（FOFA 模式）
open_local = True  # 是否启用本地源（优先使用 `local_file` 内的直连接口）
open_m3u_result = False  # 是否生成 M3U 格式结果，False 仅生成 TXT（更精简）
open_multicast = True  # 是否启用组播源（multicast）
open_multicast_foodie = True  # 组播 Foodie 模式子开关
open_multicast_fofa = False  # 组播 FOFA 模式子开关
open_online_search = True  # 是否启用在线关键字搜索源
open_request = True  # 是否启用网络请求（从在线源拉取接口）
open_rtmp = True  # 是否开启 RTMP 推流支持（提高直播稳定性）
# 为便于验证与长期运维，建议测试阶段启用服务；生产若需节省资源可设为 False  # 说明行
open_service = True  # 是否开启内置 Web 服务以方便通过 HTTP 接口查看结果
open_speed_test = True  # 是否启用测速功能（检测接口速率/延迟等）
open_subscribe = True  # 是否启用订阅源抓取
open_supply = True  # 是否启用补偿机制（接口不足时补充可用接口）
open_update = True  # 是否允许自动更新（启用后按间隔定期更新）
open_update_time = False  # 是否在结果中显示更新时间，False 可减少文件体积
open_url_info = False  # 是否在接口后显示说明信息（$ 后面的内容）
open_use_cache = True  # 是否使用本地缓存以提升请求稳定性与效率
open_history = True  # 是否启用历史接口合并以提高命中率
open_headers = False  # 是否保留 M3U 中的请求头信息，某些播放器不支持时应关闭

# 全网通+高分辨率适配  # 注释：网络/台标/地域相关适配设置
app_host = http://0.0.0.0  # 服务绑定地址，0.0.0.0 表示接受所有网卡访问（容器常用）
app_port = 8000  # 服务端口
cdn_url = https://cdn.jsdelivr.net  # CDN 地址，供台标或订阅代理使用（可加速资源）
isp =  # 运营商过滤：为空表示不限定运营商（全网通）
ipv_type =  # IP 协议类型限制（为空表示自动）
ipv_type_prefer =  # IP 类型偏好（为空表示不指定）
location =  # 地域过滤（为空表示不限定）
logo_url = https://cdn.jsdelivr.net/gh/fanmingming/live/main/tv/  # 台标 CDN 地址（加速台标加载）
logo_type = png  # 台标文件类型

# 高分辨率秒播防卡顿核心参数（“最强”模式：更严格、更稳定）  # 注释：画质/测速阈值等核心参数
min_resolution = 1920x1080  # 最低分辨率阈值，保留 1080p 及以上的接口
max_resolution = 3840x2160  # 最高支持分辨率（4K）
# 提高速率门槛（比原来更严格），可保证更低卡顿风险；若频道数量不足可下调  # 说明
min_speed = 1.5  # 最低速率阈值（单位 M/s），低于此速率的接口会被过滤
# 测速并发数：适中偏高，能加快测速完成，但会占用更多网络/CPU  # 说明
speed_test_limit = 20  # 同时并行测速的接口数量上限
# 测速超时：4K 节点可能延时较高，延长以避免误判  # 说明
speed_test_timeout = 10  # 单个接口测速超时时间（秒）
speed_test_filter_host = False  # 是否按 Host 汇并测速（开启可减少测速次数但可能降低准确性）

# 源优先级（高分辨率秒播逻辑）  # 注释：指定本地/订阅/组播等优先级与数量
local_file = config/local.txt  # 本地源文件路径（优先使用该文件中接口）
local_num = 20  # 本地源在结果中保留的优先接口数量
subscribe_num = 40  # 从订阅源中偏好保留的接口数量
origin_type_prefer = local,subscribe,multicast,hotel  # 源优先级顺序
recent_days = 10  # 只获取最近 N 天内的接口记录以保证新鲜度
request_timeout = 10  # 网络请求的超时时间（秒）

# 自动化（高分辨率防卡顿）  # 注释：更新频率与每频道接口保留
urls_limit = 8  # 每个频道保留的接口数量上限
# 更频繁更新以保持高分辨率接口新鲜（资源允许下可设 1 或 2 小时）  # 说明
update_interval = 2  # 定时更新间隔（小时）
update_time_position = bottom  # 更新时间显示位置（top/bottom）

# 说明（保留）  # 注释：对关键项的逐条解释
# 1. min_resolution = 1920x1080 → 强制只保留1080P+高分辨率频道  # 说明
# 2. min_speed = 1.5 → 高分辨率需 >=1.5M/s（可根据实际网速上下调整）  # 说明
# 3. open_filter_resolution = True → 核心开关，过滤低分辨率频道  # 说明
# 4. speed_test_timeout = 10 → 延长超时以防误判慢响应的高质量源  # 说明
