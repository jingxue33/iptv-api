[Settings]
# 基础文件配置（确保输入输出路径正确）
source_file = config/user_demo.txt
final_file = output/user_result.txt

# 核心功能开关（只保留稳定性相关功能，关闭冗余拦截）
open_driver = False
open_epg = True                  # 保留节目指南（提升体验，不影响稳定性）
open_empty_category = False      # 关闭空分类（避免无效线路）
open_filter_resolution = True    # 保留分辨率过滤（保证基础画质）
open_filter_speed = True         # 保留速度过滤（保证基础流畅）
open_speed_test = True           # 保留速度测试（核心稳定性校验）
open_update = True               # 启用自动更新（确保源新鲜）
open_update_time = True          # 显示更新时间（便于排查）
open_service = True              # 启用服务监控（提升运行稳定性）

# 源功能配置（聚焦联通稳定来源，拒绝冷门无效源）
open_hotel = True
open_hotel_foodie = True
open_hotel_fofa = False          # 关闭冷门Fofa搜索（无稳定联通源）
open_local = True                # 本地源（最稳定，优先）
open_multicast = True            # 组播源（联通网络适配好）
open_multicast_foodie = True
open_multicast_fofa = False      # 关闭冷门Fofa搜索
open_online_search = False       # 关闭在线搜索（易无有效联通源）
open_subscribe = True            # 订阅源（稳定度高，优先）

# 高级功能配置（兼容解码为主，不搞复杂逻辑）
open_m3u_result = True           # 支持M3U（主流稳定格式）
open_rtmp = False                # 关闭RTMP（兼容性差，易解码失败）
open_request = False             # 关闭复杂请求（避免网络适配问题）
open_supply = True               # 启用资源补充（兜底线路数量）
open_use_cache = True            # 启用缓存（复用稳定源，提升效率）
open_history = True              # 保留历史记录（优先复用历史稳定源）
open_headers = False             # 关闭自定义请求头（避免冲突）
open_url_info = True             # 保留URL信息（便于问题排查）
decode_adapt = True              # 核心：自动适配解码（避免解码失败）
decode_formats = hls,http,flv    # 仅保留3种主流稳定格式（适配率99%）

# 网络配置（Docker部署取消注释，确保网络稳定）
#app_host = http://0.0.0.0
#app_port = 8000
#cdn_url =

# 数量控制（确保候选充足，输出稳定15条）
hotel_num = 20                    # 候选池适度扩大（避免筛选后不足）
local_num = 20
multicast_num = 20
subscribe_num = 20
online_search_num = 0
urls_limit = 15                   # 最终输出固定15条（强制兜底）
duplicate_filter = True           # 启用去重（避免重复线路占用名额）
low_quality_filter = False        # 关闭低质过滤（避免误杀稳定源）

# 分页配置（确保获取足够稳定候选源）
hotel_page_num = 4
multicast_page_num = 4
online_search_page_num = 1

# 地区配置（不限制地域，避免稳定源因地域被过滤）
hotel_region_list = 全部
multicast_region_list = 全部

# 网络类型（联通IPv4优先，强化网络稳定性）
ipv_type = 全部
ipv_type_prefer = ipv4            # 联通IPv4更稳定，优先使用
ipv4_num =
ipv6_num =
ipv6_support = False              # 关闭IPv6（避免兼容问题）
tcp_fast_open = True              # 启用TCP快速打开（提升连接稳定性）
dns_cache = True                  # 启用DNS缓存（减少解析延迟，避免超时）

# 过滤条件（宽松必要，确保稳定源通过率）
isp = 联通                        # 仅保留联通源（核心适配，避免跨网不稳定）
location =
min_resolution = 1280x720         # 720P+（基础画质，不妥协）
max_resolution = 1920x1080
min_speed = 1.2                   # 最低1.2Mbps（流畅门槛，不苛刻）
packet_loss_rate = 1.0            # 丢包率≤1.0%（容忍轻微波动，避免误判）
jitter_threshold = 40             # 抖动≤40ms（避免明显卡顿）
connect_timeout = 2.5             # 连接超时2.5秒（适配联通网络波动）

# 性能优化（聚焦稳定性，简化测试逻辑）
recent_days = 15                  # 15天内的源（足够多且新鲜稳定）
request_timeout = 12              # 请求超时12秒（避免网络波动导致超时）
speed_test_limit = 8              # 测试样本8次（平衡精准度和通过率）
speed_test_timeout = 7            # 测试超时7秒（确保测试完成，不提前终止）
speed_test_filter_host = False    # 关闭主机过滤（减少稳定源被拦截）
speed_test_retry = 2              # 重试2次（避免偶然波动导致误判）
cache_valid_time = 3600           # 缓存1小时（复用稳定源，减少重复测试）

# 秒播放配置（优先但不苛刻，确保稳定性）
open_second_play = True           # 秒播放仍排第一（提升体验）
second_play_threshold = 1.5       # 1.5秒内视为秒开（宽松门槛，保证线路数量）
second_play_stable = False        # 不强制连续秒开（避免过滤稳定非秒开源）
preload_check = True              # 预加载检测（确保能播放，核心稳定保障）
decode_pre_check = False          # 关闭解码预校验（提升稳定源通过率）

# 排序优先级（稳定性>体验>数量，兼顾平衡）
sort_priority = preload_check,second_play,speed,packet_loss_rate,jitter_threshold,origin_type,resolution
# 排序逻辑：可播放性→秒播放→速度→丢包率→抖动→来源→分辨率（先保证能稳定播，再谈体验）
origin_type_prefer = local,subscribe,multicast,hotel  # 稳定来源优先顺序

# 时间配置（确保源新鲜且稳定补充）
time_zone = Asia/Shanghai
update_interval = 4               # 4小时更新一次（新鲜度兜底）
update_time_position = top
update_filter_stale = True        # 自动剔除失效源（保证稳定性）
update_supplement = True          # 自动补充失效源（确保15条线路不减少）
