[Settings]
# 修改模板和结果文件配置
source_file = config/user_demo.txt
final_file = output/user_result.txt

# 基础功能配置
open_driver = False
open_epg = True
open_empty_category = False
open_filter_resolution = True
open_filter_speed = True
open_speed_test = True
open_update = True
open_update_time = True
open_service = True

# 源功能配置（联通网络优先：本地>订阅>组播>酒店）
open_hotel = True
open_hotel_foodie = True
open_hotel_fofa = False
open_local = True
open_multicast = True
open_multicast_foodie = True
open_multicast_fofa = False
open_online_search = False
open_subscribe = True

# 高级功能配置
open_m3u_result = True
open_rtmp = False
open_request = False
open_supply = True
open_use_cache = True
open_history = True
open_headers = False
open_url_info = True

# 网络配置（Docker部署时取消注释）
#app_host = http://0.0.0.0
#app_port = 8000
#cdn_url =

# 数量控制配置（联通网络精简高效，固定15条线路）
hotel_num = 15
local_num = 15
multicast_num = 15
subscribe_num = 15
online_search_num = 0
urls_limit = 15
# 最终输出15条核心线路
duplicate_filter = True
# 核心优化1：启用重复线路过滤（避免同一资源重复出现）

# 分页配置（确保获取足够优质资源用于排序）
hotel_page_num = 3
multicast_page_num = 3
online_search_page_num = 1

# 地区配置（按需指定省份，例：北京,上海）
hotel_region_list = 全部
multicast_region_list = 全部

# 网络类型配置（联通IPv4优先，强化兼容性）
ipv_type = 全部
ipv_type_prefer = ipv4
ipv4_num =
ipv6_num =
ipv6_support = False
tcp_fast_open = True
# 核心优化2：启用TCP快速打开（联通网络秒开关键优化）
dns_cache = True
# 核心优化3：启用DNS缓存（减少域名解析耗时，提升秒开率）

# 过滤条件配置（联通专属，强化优质线路筛选）
isp = 联通
location =
min_resolution = 1280x720
max_resolution = 1920x1080
min_speed = 1.2
packet_loss_rate = 0.5
# 核心优化4：新增丢包率过滤（≤0.5%，避免卡顿线路）
jitter_threshold = 30
# 核心优化5：新增抖动过滤（≤30ms，确保播放流畅）
connect_timeout = 2
# 核心优化6：连接超时限制（≤2秒，直接剔除连接慢的线路）

# 性能优化配置（适配联通网络，强化秒开稳定性）
recent_days = 15
request_timeout = 10
# 缩短请求超时（原12→10，优先保留响应快的线路）
speed_test_limit = 10
# 增加测试样本（原8→10，秒开判断更精准）
speed_test_timeout = 6
# 大幅缩短测试超时（原8→6，聚焦秒开线路）
speed_test_filter_host = True
speed_test_retry = 2
# 核心优化7：速度测试重试（2次，避免偶然波动误判）
cache_valid_time = 3600
# 核心优化8：缓存有效期（1小时，平衡新鲜度和性能）

# 秒播放核心配置（优先第一，强化检测）
open_second_play = True
# 启用秒播放检测
second_play_threshold = 0.8
# 严格秒开标准（≤0.8秒，原1.0→更精准）
second_play_stable = True
# 核心优化9：秒开稳定性校验（连续2次测试均达标才认定）
preload_check = True
# 核心优化10：预加载检测（提前校验资源可用性，避免点击后加载失败）

# 排序优先级配置（秒播放第一，叠加稳定性指标）
sort_priority = second_play,packet_loss_rate,jitter_threshold,speed,origin_type,resolution
# 排序逻辑：秒播放→丢包率（低→高）→抖动（低→高）→速度（高→低）→来源→分辨率
origin_type_prefer = local,subscribe,multicast,hotel
# 来源优先级（次要排序）

# 时间配置（4小时更新，确保秒开线路新鲜）
time_zone = Asia/Shanghai
update_interval = 4
update_time_position = top
update_filter_stale = True
# 核心优化11：更新时剔除失效线路（确保15条均为可用线路）
