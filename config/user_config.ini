[Settings]
# ===================================== 基础文件配置（TXT输出+高分辨率） =====================================
# 模板文件路径：兼容高分辨率频道的基础模板
source_file = config/user_demo.txt
# 最终生成文件：TXT格式，全网通高分辨率秒播频道
final_file = output/IPTV_4K_Fast_All_Network.txt

# ===================================== 核心开关（高分辨率+全网通+秒播） =====================================
# 禁用浏览器驱动：减少内存占用，不影响高分辨率解码
open_driver = False
# 关闭EPG：优先保证高分辨率频道秒播，EPG后台异步加载
open_epg = False
# 隐藏无效分类：减少列表加载耗时，高分辨率频道秒刷
open_empty_category = True
# 【核心】启用高分辨率过滤：只保留1080P/4K频道，杜绝低画质
open_filter_resolution = True
# 智能速率过滤：高分辨率需更高带宽，平衡速度和画质
open_filter_speed = True
# 启用酒店源：补充全网通高分辨率接口
open_hotel = True
open_hotel_foodie = True
open_hotel_fofa = True
# 启用本地源：优先本地高分辨率直连接口（秒播核心）
open_local = True
# 极简TXT输出：无冗余信息，高分辨率频道解析更快
open_m3u_result = False
# 启用组播源：补充全网通高分辨率组播接口
open_multicast = True
open_multicast_foodie = True
open_multicast_fofa = False
# 精准在线搜索：只搜1080P/4K高分辨率接口，避免低画质
open_online_search = True
# 启用网络查询：快速获取全网通高分辨率高速接口
open_request = True
# 启用RTMP：高分辨率频道RTMP传输更稳定，减少卡顿
open_rtmp = True
# 禁用Web服务：减少资源占用，保障高分辨率解码
open_service = False
# 高分辨率专属测速：兼顾带宽和延迟，解决卡顿
open_speed_test = True
# 全开订阅源：拉取全网通高分辨率订阅源
open_subscribe = True
# 补偿机制：高分辨率接口不足时补充，避免频道缺失
open_supply = True
# 高频更新：高分辨率接口更新快，保证新鲜度
open_update = True
# 禁用更新时间：减少TXT解析耗时
open_update_time = False
# 禁用接口说明：播放器秒识别高分辨率频道
open_url_info = False
# 启用缓存：本地缓存高分辨率接口，秒播不卡顿
open_use_cache = True
# 保留历史接口：高分辨率接口稀缺，备用防卡顿
open_history = True
# 禁用验证信息：兼容所有播放器解析高分辨率TXT
open_headers = False

# ===================================== 全网通+高分辨率适配 =====================================
# 本地服务地址：兼容全网通网络
app_host = http://localhost
app_port = 8000
# 高分辨率CDN：兼容所有运营商，4K/1080P加载快
cdn_url = https://cdn.jsdelivr.net
# 取消运营商限制：全网通（电信/联通/移动/广电）
isp = 
# IP类型自动适配：IPv4/IPv6均兼容，高分辨率传输稳定
ipv_type = 
ipv_type_prefer = 
# 取消地域限制：全网通无地域锁
location = 
# 高分辨率台标地址：CDN加速，加载快
logo_url = https://cdn.jsdelivr.net/gh/fanmingming/live/main/tv/
logo_type = png

# ===================================== 高分辨率秒播防卡顿核心参数 =====================================
# 最低分辨率：锁定1080P，只保留高画质频道（4K可设为3840x2160）
min_resolution = 1920x1080
# 最高分辨率：支持4K，兼容所有高画质接口
max_resolution = 3840x2160
# 速率阈值：高分辨率需1.2M/s以上，保证无卡顿
min_speed = 1.2
# 测速并发数：高分辨率接口少，精准测速不浪费资源
speed_test_limit = 15
# 测速超时：高分辨率接口加载稍慢，延长超时避免误判
speed_test_timeout = 6
# 关闭Host过滤：兼容更多全网通高分辨率接口
speed_test_filter_host = False

# ===================================== 源优先级（高分辨率秒播逻辑） =====================================
# 本地高分辨率源文件：存放4K/1080P直连接口
local_file = config/local.txt
# 本地高分辨率源数量：保留20个最优接口，秒播优先
local_num = 20
# 订阅源数量：拉满40个高分辨率接口，补充频道
subscribe_num = 40
# 源优先级：本地高分辨率>订阅>组播>酒店，秒播无卡顿
origin_type_prefer = local,subscribe,multicast,hotel
# 接口有效期：延长至10天，高分辨率接口稀缺，减少更新频率
recent_days = 10
# 请求超时：高分辨率接口加载稍慢，延长超时
request_timeout = 8

# ===================================== 自动化配置（高分辨率防卡顿） =====================================
# 每个频道保留接口数：8个高分辨率接口，播放器秒选最优
urls_limit = 8
# 更新间隔：3小时，平衡高分辨率接口新鲜度和资源占用
update_interval = 3
# 更新时间位置：文件底部，不影响解析
update_time_position = bottom

# ===================================== 配置说明 =====================================
# 1. min_resolution = 1920x1080 → 强制只保留1080P+高分辨率频道，杜绝低画质
# 2. min_speed = 1.2 → 高分辨率需1.2M/s以上带宽，保证播放不卡顿
# 3. isp/location 清空 → 全网通，所有运营商均可播放高分辨率频道
# 4. open_filter_resolution = True → 核心开关，过滤低分辨率频道
# 5. max_resolution = 3840x2160 → 兼容4K频道，可根据需求调整
