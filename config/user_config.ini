[Settings]
# 修改模板和结果文件配置：
source_file = config/user_demo.txt
final_file = output/user_result.txt

# 基础功能配置
open_driver = False
open_epg = True
open_empty_category = False
open_filter_resolution = True
open_filter_speed = True
open_speed_test = True  # 联通网络建议保留测速，过滤低速源
open_update = True
open_update_time = True
open_service = True

# 源功能配置（联通网络优先保留本地/订阅/组播源，酒店源按需保留）
open_hotel = True
open_hotel_foodie = True
open_hotel_fofa = False
open_local = True  # 本地源联通访问最稳定，优先启用
open_multicast = True  # 组播源在联通网络中兼容性较好
open_multicast_foodie = True
open_multicast_fofa = False
open_online_search = False  # 在线搜索源跨运营商可能卡顿，关闭
open_subscribe = True  # 订阅源可自定义联通专属源，优先启用

# 高级功能配置
open_m3u_result = True
open_rtmp = False  # 联通网络RTMP协议兼容性一般，关闭
open_request = False
open_supply = True
open_use_cache = True  # 缓存有效联通源，加快下次采集
open_history = True
open_headers = False
open_url_info = True

# 网络配置（Docker部署时取消注释）
#app_host = http://0.0.0.0
#app_port = 8000
#cdn_url =

# 数量控制配置（联通网络无需过多源，精简高效）
hotel_num = 12
local_num = 15  # 本地源优先多保留
multicast_num = 15  # 组播源联通适配好，多保留
subscribe_num = 15  # 订阅源可自定义联通源，多保留
online_search_num = 0
urls_limit = 12  # 总数量适中，避免冗余

# 分页配置
hotel_page_num = 2
multicast_page_num = 2
online_search_page_num = 1

# 地区配置（按需指定，联通本地地区源更稳定）
hotel_region_list = 全部  # 若知道所在省份，可改为「北京,上海」等（例：酒店源优先本地省份）
multicast_region_list = 全部

# 网络类型配置（联通IPv4网络更稳定，强化优先级）
ipv_type = 全部
ipv_type_prefer = ipv4  # 强制优先IPv4（联通IPv6覆盖不如IPv4稳定）
ipv4_num =
ipv6_num =
ipv6_support = False  # 关闭IPv6（联通IPv6部分地区卡顿，避免无效请求）

# 过滤条件配置（重点筛选联通运营商）
isp = 联通  # 仅保留联通运营商的源，排除电信/移动跨网卡顿源
location =  # 按需填写所在省份（例：北京），进一步精准筛选本地联通源
min_resolution = 1280x720  # 联通网络支持720P-1080P流畅播放
max_resolution = 1920x1080
min_speed = 1.2  # 联通网络最低速度提升到1.2Mbps，过滤低速卡顿源

# 性能优化配置（适配联通网络延迟特性）
recent_days = 15
request_timeout = 12  # 联通网络响应较快，缩短超时时间（原15s→12s）
speed_test_limit = 6  # 降低并发测速（原8→6），避免联通网络限速
speed_test_timeout = 10  # 测速超时缩短（原12s→10s），提高效率
speed_test_filter_host = True  # 保留测速主机过滤，避免跨网测速误判

# 来源偏好配置（联通网络最优源顺序）
origin_type_prefer = local,subscribe,multicast,hotel  # 本地>订阅>组播>酒店（联通适配度递减）

# 时间配置
time_zone = Asia/Shanghai
update_interval = 4  # 联通源更新频率提高（原6小时→4小时），确保源新鲜
update_time_position = top
