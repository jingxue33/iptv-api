[Settings]
# 修改模板和结果文件配置
source_file = config/user_demo.txt
final_file = output/user_result.txt

# 基础功能配置
open_driver = False
open_epg = True
open_empty_category = False
open_filter_resolution = True
open_filter_speed = True
open_speed_test = True
open_update = True
open_update_time = True
open_service = True

# 源功能配置（联通网络优先：本地>订阅>组播>酒店）
open_hotel = True
open_hotel_foodie = True
open_hotel_fofa = False
open_local = True
open_multicast = True
open_multicast_foodie = True
open_multicast_fofa = False
open_online_search = False
open_subscribe = True

# 高级功能配置
open_m3u_result = True
open_rtmp = False
open_request = False
open_supply = True
open_use_cache = True
open_history = True
open_headers = False
open_url_info = True

# 网络配置（Docker部署时取消注释）
#app_host = http://0.0.0.0
#app_port = 8000
#cdn_url =

# 数量控制配置（联通网络精简高效）
hotel_num = 12
local_num = 15
multicast_num = 15
subscribe_num = 15
online_search_num = 0
urls_limit = 12

# 分页配置
hotel_page_num = 2
multicast_page_num = 2
online_search_page_num = 1

# 地区配置（按需指定省份，例：北京,上海）
hotel_region_list = 全部
multicast_region_list = 全部

# 网络类型配置（联通优先IPv4，关闭IPv6）
ipv_type = 全部
ipv_type_prefer = ipv4
ipv4_num =
ipv6_num =
ipv6_support = False

# 过滤条件配置（联通专属：仅联通运营商、720P-1080P、最低1.2Mbps）
isp = 联通
location =
min_resolution = 1280x720
max_resolution = 1920x1080
min_speed = 1.2

# 性能优化配置（适配联通网络特性）
recent_days = 15
request_timeout = 12
speed_test_limit = 6
speed_test_timeout = 10
speed_test_filter_host = True

# 来源偏好配置（联通最优顺序）
origin_type_prefer = local,subscribe,multicast,hotel

# 时间配置（4小时更新一次，确保源新鲜）
time_zone = Asia/Shanghai
update_interval = 4
update_time_position = top
