[Settings]
# ===================================== 基础文件配置 =====================================
# 模板文件路径：订阅源/本地源的基础模板文件
source_file = config/user_demo.txt
# 最终生成的秒播文件路径：改用m3u后缀，播放器解析更快
final_file = output/IPTV_Unicom_Fast.m3u

# ===================================== 核心秒播开关（Docker+联通专属） =====================================
# 禁用浏览器驱动：Docker环境无需，减少内存占用，提升秒播启动速度
open_driver = False
# 启用EPG节目预告：后台异步加载，不影响频道秒播
open_epg = True
# 自动隐藏无效分类：减少频道列表加载耗时，秒刷列表
open_empty_category = True
# 启用分辨率过滤：只保留1080P高清接口，杜绝低画质拖慢播放
open_filter_resolution = True
# 启用速率过滤：只保留高速接口，核心秒播逻辑
open_filter_speed = True
# 禁用酒店源：跨网延迟高，影响秒播，仅保留联通本地源
open_hotel = False
# 禁用美食类酒店源：同上，减少冗余接口
open_hotel_foodie = False
# 禁用FOFA酒店源：同上，避免无效接口拖慢速度
open_hotel_fofa = False
# 启用本地源：本地接口无网络延迟，秒播核心依赖
open_local = True
# 生成带台标M3U：播放器可快速识别频道，加载更快
open_m3u_result = True
# 禁用组播源：联通订阅源比组播更稳定，秒播优先
open_multicast = False
# 禁用美食类组播源：同上，减少冗余
open_multicast_foodie = False
# 禁用FOFA组播源：同上，避免无效接口
open_multicast_fofa = False
# 禁用在线搜索：避免冗余接口拖慢列表加载，秒播优先本地/订阅源
open_online_search = False
# 禁用网络查询：减少网络请求，依赖本地+订阅源，提升秒播速度
open_request = False
# 启用RTMP推流：联通带宽利用率拉满，秒开关键
open_rtmp = True
# 禁用Web页面服务：Docker部署无需，减少资源占用，提升秒播
open_service = False
# 启用测速：筛选高速接口，核心秒播逻辑（已优化参数，不耗时）
open_speed_test = True
# 【核心】启用订阅源：开启后自动拉取联通专属订阅源，补充频道数量
open_subscribe = True
# 启用补偿机制：订阅源接口不足时自动补充，保证频道数量
open_supply = True
# 启用自动更新：订阅源/本地源接口自动更新，保证新鲜度
open_update = True
# 禁用更新时间显示：减少M3U文件解析耗时，播放器加载更快
open_update_time = False
# 禁用接口说明：播放器无需解析额外信息，秒识别频道
open_url_info = False
# 启用本地缓存：Docker环境更新秒完成，无需重复下载
open_use_cache = True
# 禁用历史合并：只保留最新高速接口，避免旧接口拖慢秒播
open_history = False
# 禁用M3U验证信息：兼容所有播放器，无需额外解析，秒播
open_headers = False

# ===================================== 联通网络专属适配（低延迟核心） =====================================
# 本地服务地址：Docker内服务监听地址，不影响外部访问
app_host = http://localhost
# 本地服务端口：Docker内端口，映射后不影响使用
app_port = 8000
# 台标CDN地址：北方联通优化CDN，台标加载秒开
cdn_url = https://cdn.baomitu.com
# 运营商筛选：只保留联通/中国联通接口，避免跨网延迟
isp = 联通,中国联通
# IP类型：强制IPv4，北方联通IPv4网络稳定性拉满，秒播关键
ipv_type = ipv4
# IP优先级：优先使用IPv4，杜绝IPv6转换延迟
ipv_type_prefer = ipv4
# 地域筛选：只保留北方联通核心覆盖区接口，50km内近源，秒播
location = 北京,天津,河北,山东,山西,内蒙古
# 台标远程地址：联通CDN加速，台标秒加载
logo_url = https://raw.githubusercontent.com/fanmingming/live/main/tv/
# 台标格式：PNG格式体积小，加载快
logo_type = png

# ===================================== 秒播画质+测速优化（订阅源适配） =====================================
# 最低分辨率：只保留1080P，联通带宽完全支撑，不牺牲画质
min_resolution = 1920x1080
# 最高分辨率：锁定1080P，避免播放器适配耗时
max_resolution = 1920x1080
# 最低速率阈值：0.8M/s，平衡订阅源速度和数量，避免过度过滤
min_speed = 0.8
# 测速并发数：30，Docker资源充足，订阅源测速效率拉满
speed_test_limit = 30
# 测速超时：4秒，兼容远程订阅源网络延迟，不遗漏有效接口
speed_test_timeout = 4
# 启用Host过滤：测速耗时减少80%，秒播无感知
speed_test_filter_host = True

# ===================================== 源优先级配置（本地+订阅源双优） =====================================
# 本地源文件路径：存放联通直连接口，秒播核心
local_file = config/local.txt
# 本地源保留数量：15个，只留最优直连接口，秒播优先
local_num = 15
# 订阅源保留数量：30个，开启订阅源后拉满数量，补充频道
subscribe_num = 30
# 源优先级：本地源优先（秒播），订阅源补充（保证数量）
origin_type_prefer = local,subscribe
# 接口有效期：3天，只保留近期更新的订阅源接口，确保高速
recent_days = 3
# 请求超时：4秒，兼容订阅源远程接口，避免误判无效
request_timeout = 4

# ===================================== Docker自动化配置（订阅源高频更新） =====================================
# 每个频道保留接口数：5个，播放器秒选最优接口，无缓冲
urls_limit = 5
# 更新间隔：4小时，订阅源接口新鲜度拉满，保证秒播
update_interval = 4
# 更新时间位置：文件底部，不影响播放器解析
update_time_position = bottom

# ===================================== 配置说明（单独换行，不影响语法解析） =====================================
# 1. open_subscribe = True → 强制开启订阅源，核心开关
# 2. subscribe_num = 30 → 订阅源接口数量拉满，补充频道
# 3. update_interval = 4 → 订阅源每4小时更新，接口新鲜
# 4. min_speed = 0.8 → 平衡订阅源速度和数量，不遗漏有效接口
# 5. speed_test_timeout = 4 → 兼容订阅源远程延迟，测速更精准
