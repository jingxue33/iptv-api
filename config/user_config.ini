[Settings]
# 修改模板和结果文件配置
source_file = config/user_demo.txt
final_file = output/user_result.txt

# 基础功能配置
open_driver = False
open_epg = True
open_empty_category = False
open_filter_resolution = True
open_filter_speed = True
open_speed_test = True
open_update = True
open_update_time = True
open_service = True

# 源功能配置（扩大优质资源池，确保候选充足）
open_hotel = True
open_hotel_foodie = True
open_hotel_fofa = False
open_local = True
open_multicast = True
open_multicast_foodie = True
open_multicast_fofa = False
open_online_search = True
# 开启在线搜索（补充优质资源，避免频道减少）
open_subscribe = True
subscribe_source = high_quality
# 订阅源仅选高质量标签（过滤低质订阅）

# 高级功能配置（强化解码兼容性）
open_m3u_result = True
open_rtmp = True
# 启用RTMP协议支持（适配更多解码场景）
open_request = True
# 启用多请求方式（提升资源获取成功率）
open_supply = True
open_use_cache = True
open_history = True
open_headers = True
# 启用自定义请求头（适配更多源的解码要求）
open_url_info = True
decode_adapt = True
# 核心：启用解码自适应（自动匹配最佳解码方式）
decode_formats = hls,rtmp,http,flv
# 支持主流解码格式（覆盖99%优质源）

# 网络配置（Docker部署时取消注释）
#app_host = http://0.0.0.0
#app_port = 8000
#cdn_url =

# 数量控制配置（扩大候选池，确保输出15条不减少）
hotel_num = 25
# 候选池扩大（原15→25，更多优质资源可选）
local_num = 25
multicast_num = 25
subscribe_num = 25
online_search_num = 15
# 在线搜索补充15条候选
urls_limit = 15
# 最终输出仍为15条（宽进严出）
duplicate_filter = True
# 去重（避免重复占用名额，确保有效数量）
low_quality_filter = True
# 新增：直接过滤低质标签源（提前剔除无效资源）

# 分页配置（扩大候选获取范围）
hotel_page_num = 5
# 分页增加（原3→5，确保获取足够候选）
multicast_page_num = 5
online_search_page_num = 3

# 地区配置（保留全部，避免地域限制导致频道减少）
hotel_region_list = 全部
multicast_region_list = 全部

# 网络类型配置（强化稳定性，适配解码传输）
ipv_type = 全部
ipv_type_prefer = ipv4
ipv4_num =
ipv6_num =
ipv6_support = False
tcp_fast_open = True
# TCP快速打开（提升传输稳定性）
dns_cache = True
# DNS缓存（减少解析延迟，避免解码超时）
network_stable_check = True
# 新增：网络稳定性校验（仅保留传输稳定的源）

# 过滤条件配置（多维度强化优质筛选，不牺牲数量）
isp = 联通
location =
min_resolution = 1280x720
# 保留720P+高清标准
max_resolution = 1920x1080
min_speed = 1.5
# 提升最低速度（原1.2→1.5Mbps，确保流畅）
packet_loss_rate = 0.3
# 严格丢包率（≤0.3%，比原0.5更稳定）
jitter_threshold = 20
# 严格抖动（≤20ms，杜绝跳帧）
connect_timeout = 1.5
# 缩短连接超时（≤1.5秒，剔除慢源）
decode_success_rate = 95
# 新增：解码成功率≥95%（仅保留能正常解码的源）
epg_valid = True
# 新增：仅保留EPG有效源（节目指南完整，提升使用体验）

# 性能优化配置（提升筛选精准度和稳定性）
recent_days = 10
# 缩短时间范围（原15→10，仅保留近期稳定源）
request_timeout = 8
# 进一步缩短请求超时（原10→8，聚焦优质快源）
speed_test_limit = 15
# 增加测试样本（原10→15，质量判断更精准）
speed_test_timeout = 5
# 缩短测试超时（原6→5，筛选秒开稳定源）
speed_test_filter_host = True
speed_test_retry = 3
# 增加重试次数（原2→3，避免偶然波动误判）
cache_valid_time = 1800
# 缩短缓存（原3600→1800秒，确保源新鲜）
stable_connect_count = 3
# 新增：需连续3次连接成功才认定稳定

# 秒播放核心配置（保留优先，强化稳定性）
open_second_play = True
second_play_threshold = 1.0
# 适度放宽秒开阈值（原0.8→1.0，避免优质非秒开源被剔除）
second_play_stable = True
# 连续2次测试达标
preload_check = True
# 预加载检测（确保解码成功）
decode_pre_check = True
# 新增：解码预校验（提前排除解码失败的源）

# 排序优先级配置（质量>稳定>秒开>数量）
sort_priority = decode_success_rate,packet_loss_rate,jitter_threshold,second_play,speed,origin_type,resolution
# 排序逻辑：解码成功率→丢包率→抖动→秒播放→速度→来源→分辨率（先保证能看，再追求快）
origin_type_prefer = local,subscribe,online_search,multicast,hotel
# 新增在线搜索优先级

# 时间配置（保持高频更新，确保源新鲜）
time_zone = Asia/Shanghai
update_interval = 4
update_time_position = top
update_filter_stale = True
# 剔除失效线路
update_supplement = True
# 新增：更新时自动补充失效线路（确保15条数量不减少）
