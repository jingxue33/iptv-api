[Settings]
# 修改模板和结果文件配置（保留原路径，补充目录权限提醒）
source_file = config/user_demo.txt
final_file = output/user_result.txt

# 基础功能配置（保留全部开启，补充性能适配）
open_driver = False
open_epg = True
open_empty_category = False
open_filter_resolution = True
open_filter_speed = True
open_speed_test = True          # 保留开启，优化测速参数适配
open_update = True
open_update_time = True
open_service = True

# 源功能配置（保留全部开启，补充FOFA风险备注）
open_hotel = True
open_hotel_foodie = True
open_hotel_fofa = True          # 注意：FOFA探测需确保网络权限及合规性
open_local = True
open_multicast = True
open_multicast_foodie = True
open_multicast_fofa = True      # 注意：FOFA探测需确保网络权限及合规性
open_online_search = True
open_subscribe = True

# 高级功能配置（保留原开关，补充缓存优化）
open_m3u_result = True
open_rtmp = True
open_request = False
open_supply = True
open_use_cache = True           # 强化缓存，抵消全功能开启的性能消耗
open_history = True
open_headers = True
open_url_info = True

# 网络配置（Docker部署适配，取消注释并配置）
app_host = http://0.0.0.0       # Docker容器内监听所有地址
app_port = 8000                 # 宿主机映射端口建议：8000:8000
# cdn_url = https://your-cdn.com # 有CDN时配置，无则保留注释

# 数量控制配置（核心优化：解决URL截断问题）
hotel_num = 15
local_num = 20
multicast_num = 15
subscribe_num = 15
online_search_num = 10
urls_limit = 50                 # 从8→50，适配各类num上限，避免有效内容截断

# 分页配置（适配数量，预留空间）
hotel_page_num = 2
multicast_page_num = 2
online_search_page_num = 2      # 从1→2，避免单页内容过载

# 地区配置（规范表述，提升程序兼容性）
hotel_region_list = *           # 替换“全部”为通配符，适配多数IPTV程序解析规则
multicast_region_list = *       # 替换“全部”为通配符，适配多数IPTV程序解析规则

# 网络类型配置（平衡双栈，适配全功能运行）
ipv_type = *                    # 替换“全部”为通配符，提升兼容性
ipv_type_prefer = ipv4
ipv4_num = 18                   # 从20→18，平衡IPv6数量
ipv6_num = 12                   # 从10→12，适配IPv6源，减少单栈压力
ipv6_support = True

# 过滤条件配置（微调阈值，适配全功能采集）
isp = 联通,电信,移动,广电       # 补充广电，覆盖更多源，减少过滤丢失
location = *                    # 替换“全国”为通配符，提升兼容性
min_resolution = 1280x720       # 保留原阈值，若内容过少可改为640x360
max_resolution = 1920x1080
min_speed = 0.8                 # 从1.0→0.8，降低门槛，避免有效源被过滤

# 性能优化配置（核心优化：适配全功能高负载）
recent_days = 7
request_timeout = 25            # 从15→25，延长超时，适配多源并发请求
speed_test_limit = 8            # 从10→8，减少测速次数，降低CPU占用
speed_test_timeout = 18         # 从12→18，延长测速超时，保证结果准确
speed_test_filter_host = True
request_retry_times = 2         # 新增：请求失败重试，提升采集成功率

# 来源偏好配置（优化顺序，减少异地请求耗时）
origin_type_prefer = local,subscribe,multicast,hotel  # 酒店源后置，优先本地/订阅

# 时间配置（明确单位，规避信息泄露风险）
time_zone = Asia/Shanghai
update_interval = 6h            # 从6→6h，明确为6小时更新，避免歧义
# 替换GitHub公共仓库为私有存储（核心风险规避）
update_time_position = top:本地路径/iptv_update_log.txt;backup:https://your-private-repo/iptv-update-log.txt
