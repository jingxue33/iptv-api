[Settings]
# 基础文件配置（精简路径，减少IO耗时）
source_file = config/user_demo.txt
final_file = output/IPTV_Unicom_Fast.m3u  # 改用m3u后缀，播放器解析更快
# 核心秒播开关（只保留核心，禁用所有冗余逻辑）
open_driver = False          # 禁用浏览器（Docker无需，减少内存占用）
open_epg = True              # 保留EPG（异步加载，不影响秒播）
open_empty_category = True   # 隐藏无效分类，减少列表加载耗时
open_filter_resolution = True# 启用分辨率过滤（只留1080P）
open_filter_speed = True     # 启用速率过滤（只留高速接口）
open_hotel = False           # 禁用酒店源（跨网延迟高）
open_hotel_foodie = False
open_hotel_fofa = False
open_local = True            # 本地源优先（秒播无网络依赖）
open_m3u_result = True       # 生成带台标M3U（播放器快速识别）
open_multicast = False       # 禁用组播（联通订阅源更稳定）
open_multicast_foodie = False
open_multicast_fofa = False
open_online_search = False   # 禁用在线搜索（避免冗余接口拖慢加载）
open_request = False         # 禁用网络查询（依赖本地+订阅源）
open_rtmp = True             # 启用RTMP（联通带宽利用率拉满）
open_service = False         # 禁用Web服务（减少资源占用）
open_speed_test = True       # 启用测速（优化参数，不耗时）
open_subscribe = True        # 启用订阅源（同步联通近源接口）
open_supply = False          # 禁用补偿机制（只保留达标接口）
open_update = True           # 自动更新（保证接口新鲜度）
open_update_time = False     # 禁用更新时间（减少M3U解析耗时）
open_url_info = False        # 禁用接口说明（播放器快速识别）
open_use_cache = True        # 启用缓存（Docker更新秒完成）
open_history = False         # 禁用历史合并（只保留最新接口）
open_headers = False         # 禁用M3U验证（兼容所有播放器）

# 联通网络专属适配（低延迟核心）
app_host = http://localhost
app_port = 8000
cdn_url = https://cdn.baomitu.com   # 北方联通CDN，台标秒加载
isp = 联通,中国联通                  # 精准筛选联通接口
ipv_type = ipv4                     # 强制IPv4（北方联通稳定性拉满）
ipv_type_prefer = ipv4
location = 北京,天津,河北,山东,山西,内蒙古 # 筛选50km内近源接口
logo_url = https://raw.githubusercontent.com/fanmingming/live/main/tv/
logo_type = png

# 秒播画质+测速优化（精准阈值，不牺牲速度）
min_resolution = 1920x1080          # 只留1080P（联通带宽完全支撑）
max_resolution = 1920x1080
min_speed = 1.0                     # 速率阈值（1.0M/s，平衡速度和数量）
speed_test_limit = 20               # 并发测速数（Docker资源充足）
speed_test_timeout = 3              # 测速超时（3秒，只留快速响应接口）
speed_test_filter_host = True       # 启用Host过滤（测速耗时减少80%）

# 源优先级配置（秒播逻辑：本地>订阅）
local_file = config/local.txt
local_num = 15                      # 本地源数量（精简，只留最优）
subscribe_num = 20                  # 订阅源数量（筛选高速接口）
origin_type_prefer = local,subscribe # 本地源优先，秒开关键
recent_days = 2                     # 只保留2天内更新的接口（确保高速）
request_timeout = 3                 # 请求超时（3秒，拒绝慢接口）

# Docker自动化配置（长效秒播）
urls_limit = 3                      # 每个频道只留3个最优接口（播放器秒选）
update_interval = 6                 # 6小时更新（接口新鲜度拉满）
update_time_position = bottom
