[Settings]
# ===================== 基础路径（必配，确保文件存在）=====================
source_file = config/unicom_north_demo.txt
final_file = output/unicom_north_result.txt

# ===================== 核心功能（仅保留程序标配字段，无自定义）=====================
# 基础功能（仅开启最核心，其余关闭减少冲突）
open_driver = False
open_epg = True
open_empty_category = False
open_filter_resolution = False
open_filter_speed = False
open_speed_test = False
open_update = False
open_update_time = False
open_service = True

# 源功能（仅开启本地源，排除FOFA/酒店/组播等依赖）
open_hotel = False
open_hotel_foodie = False
open_hotel_fofa = False
open_local = True
open_multicast = False
open_multicast_foodie = False
open_multicast_fofa = False
open_online_search = False
open_subscribe = False

# 高级功能（仅保留M3U输出，其余关闭）
open_m3u_result = True
open_rtmp = False
open_request = False
open_supply = False
open_use_cache = False
open_history = False
open_headers = False
open_url_info = False

# ===================== 网络配置（极简，仅监听基础端口）=====================
app_host = http://0.0.0.0
app_port = 8001  # 避开8000可能的占用，降低冲突概率
# cdn_url = https://cdn.unicom.cn/iptv-north  # 先注释，启动后再开启

# ===================== 数量控制（极简值，无溢出）=====================
hotel_num = 0
local_num = 5
multicast_num = 0
subscribe_num = 0
online_search_num = 0
urls_limit = 10

# ===================== 分页配置（极简值）=====================
hotel_page_num = 0
multicast_page_num = 1
online_search_page_num = 1

# ===================== 地区/网络/过滤（极简，避免解析报错）=====================
hotel_region_list = 
multicast_region_list = 北京
location = 北京
ipv_type = ipv4
ipv_type_prefer = ipv4
ipv4_num = 5
ipv6_num = 0
ipv6_support = False
isp = 联通
min_resolution = 1280x720
max_resolution = 1920x1080
min_speed = 0.5

# ===================== 性能/时间（极简，无复杂逻辑）=====================
recent_days = 1
request_timeout = 10
speed_test_limit = 1
speed_test_timeout = 5
speed_test_filter_host = False
request_retry_times = 0
origin_type_prefer = local
time_zone = Asia/Shanghai
update_interval = 24h
update_time_position = top:config/iptv_update_log.txt  # 日志路径改为config（确保存在）
