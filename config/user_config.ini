[Settings]
#修改模板和结果文件配置：
source_file = config/user_demo.txt
final_file = output/user_result.txt
# 核心秒播开关（Docker+联通网络专属）
open_driver = False                  # 禁用浏览器模式，Docker环境无需额外适配
open_epg = True                     # 保留EPG预告，不影响秒播（后台异步加载）
open_empty_category = True          # 自动隐藏无效频道，减少列表加载耗时
open_filter_resolution = True       # 启用分辨率过滤，提前剔除低画质接口
open_filter_speed = True            # 启用速率过滤，只保留高速接口
open_hotel = False                  # 禁用酒店源（跨网延迟高，影响秒播）
open_hotel_foodie = False
open_hotel_fofa = False
open_local = True                   # 启用本地源，秒播无网络依赖
open_m3u_result = True              # 生成带图标M3U，播放器快速解析
open_multicast = False              # 禁用组播源（联通网络订阅源更稳定）
open_multicast_foodie = False
open_multicast_fofa = False
open_online_search = False          # 禁用在线搜索，避免冗余接口拖慢加载
open_request = False                # 禁用网络查询，依赖本地+订阅源，减少延迟
open_rtmp = True                    # 启用RTMP推流，Docker环境带宽利用率拉满，秒开关键
open_service = False                # 禁用Web页面服务（Docker部署无需，减少资源占用）
open_speed_test = True              # 启用测速，但优化参数降低耗时
open_subscribe = True               # 启用订阅源，同步联通近源高速接口
open_supply = False                 # 禁用补偿机制，只保留达标接口（避免低速接口）
open_update = True                  # 启用自动更新，保证接口新鲜度
open_update_time = False            # 禁用更新时间显示，减少M3U文件解析耗时
open_url_info = False               # 禁用接口说明，播放器快速识别
open_use_cache = True               # 启用本地缓存，Docker环境更新秒完成
open_history = False                # 禁用历史合并，只保留最新高速接口
open_headers = False                # 禁用M3U验证信息，兼容所有播放器

# 联通网络专属适配（低延迟核心）
app_host = http://localhost
app_port = 8000
cdn_url = https://cdn.baomitu.com   # 北方联通优化CDN，台标加载秒开
final_file = output/IPTV_Unicom_Fast.txt  # 唯一的final_file配置项
isp = 联通,中国联通                  # 精准筛选联通运营商接口，避免跨网延迟
ipv_type = ipv4                     # 北方联通IPv4网络稳定性拉满，优先启用
ipv_type_prefer = ipv4              # 强制IPv4优先，杜绝IPv6转换延迟
location = 北京,天津,河北,山东,山西,内蒙古 # 联通北方核心覆盖区，筛选50km内近源接口
logo_url = https://raw.githubusercontent.com/fanmingming/live/main/tv/
logo_type = png

# 秒播画质优化（联通带宽完全支撑）
min_resolution = 1920x1080          # 强制1080P高清，不牺牲画质
max_resolution = 1920x1080
min_speed = 1.5                     # 提高速率阈值，只保留1.5M/s以上接口（联通50M+带宽轻松达标）
speed_test_limit = 15
# Docker环境资源充足，提高并发测速数
speed_test_timeout = 5
# 缩短测速超时，只保留快速响应接口（秒播关键）
speed_test_filter_host = True
# 启用Host过滤，测速耗时减少80%（Docker环境无精度损失）

# 源优先级配置（秒播逻辑）
local_file = config/local.txt
local_num = 20
# 本地源接口数量拉满，优先展示自定义频道（秒开）
subscribe_num = 25
# 订阅源筛选联通高速接口，保证频道丰富度
origin_type_prefer = local,subscribe # 本地源>订阅源，秒开优先级排序
recent_days = 3
# 只保留3天内更新的接口，确保高速有效
request_timeout = 5
# 联通网络响应快，缩短请求超时

# Docker自动化配置（长效秒播）
urls_limit = 5
# 每个频道只保留5个最优接口，减少播放器选择耗时
update_interval = 12
# 12小时自动更新，Docker后台静默运行
update_time_position = bottom
